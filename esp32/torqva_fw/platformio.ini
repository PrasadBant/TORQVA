; TORQVA firmware: the sole supported firmware (the legacy Arduino sketch was retired from the tree; see esp32/README.md).
; Host-side unit tests:   pio test -e native
; Device build (no flash): pio run -e esp32s3

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++11 -Wall -Wextra

; Firmware-in-the-loop CLI: real torqva_core::Device + SimPlant on the host (pio run -e fitl)
[env:fitl]
platform = native
build_flags = -std=gnu++11 -Wall -Wextra
build_src_filter = -<*> +<../tools/fitl_cli.cpp>

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; N16R8: 16 MB flash, octal PSRAM -> GPIO 35-37 unavailable
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
; Partition table pinned to the board's own default (otadata + ota_0 + ota_1 of 3264 KB each, as every earlier build used), so a platform update cannot change
; the flash layout silently. Changing it needs a full USB flash and erases NVS (keys, Wi-Fi): see docs/TORQVA_OTA_FIRMWARE_MANAGER.md.
board_build.partitions = default_8MB.csv
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1 -DBOARD_HAS_PSRAM -DTORQVA_TRANSPORT_SECURED=1 -DTORQVA_CONTROL_ENABLED=1 -DTORQVA_KEY=\"dev-key-change-me\"
; Motor commands are rejected unless -DTORQVA_CONTROL_ENABLED=1 is added (human decision, Phase 8).
lib_deps =
    adafruit/Adafruit INA219@^1.2.3
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0
    olikraus/U8g2@^2.35.19

; Same firmware, serial on UART0 instead of the native USB port. Use this when the board is connected through its USB-to-serial bridge (for example the CH343 "UART" port, which
; appears as a COM port named "USB-Enhanced-SERIAL CH343"). With ARDUINO_USB_CDC_ON_BOOT=1 (env:esp32s3) `Serial` is the native USB CDC port, NOT the CH343 port: the bridge would stay silent.
; Which port your board uses is a hardware fact to confirm (docs/TORQVA_HARDWARE_READINESS.md, bring-up procedure). Nothing else differs: control stays disabled by default.
[env:esp32s3_uart]
extends = env:esp32s3
build_flags = -DARDUINO_USB_CDC_ON_BOOT=0 -DBOARD_HAS_PSRAM -DTORQVA_TRANSPORT_SECURED=1 -DTORQVA_CONTROL_ENABLED=1 -DTORQVA_KEY=\"dev-key-change-me\" -DTORQVA_DEVICE_ID=\"RIG-1\"

; OTA LED bench profiles (docs/TORQVA_OTA_LED_BENCH_TEST.md): an ESP32-S3 with ONE LED on GPIO 5 (220-330 ohm to GND) and NO motor hardware.
; Native USB like env:esp32s3 (ARDUINO_USB_MODE=1 from the board + CDC on boot = Serial is the chip's USB-Serial/JTAG port), the same partition table and the
; real OTA code. Motor control is NOT enabled and main.cpp refuses to compile a bench profile with TORQVA_CONTROL_ENABLED; PWM is never set up, no sensor is
; initialised, the OLED is off (GPIO 5 is its clock in the production map). TORQVA_BENCH_BLINK_MS is the LED half-period.
[env:esp32s3_ota_led_v100]
extends = env:esp32s3
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1 -DBOARD_HAS_PSRAM -DTORQVA_TRANSPORT_SECURED=1 -DTORQVA_DEVICE_ID=\"RIG-1\" -DTORQVA_OTA_LED_BENCH=1 -DTORQVA_OLED=0 -DTORQVA_FW_VERSION=\"1.0.0\" -DTORQVA_BENCH_BLINK_MS=500

[env:esp32s3_ota_led_v110]
extends = env:esp32s3
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1 -DBOARD_HAS_PSRAM -DTORQVA_TRANSPORT_SECURED=1 -DTORQVA_DEVICE_ID=\"RIG-1\" -DTORQVA_OTA_LED_BENCH=1 -DTORQVA_OLED=0 -DTORQVA_FW_VERSION=\"1.1.0\" -DTORQVA_BENCH_BLINK_MS=100

; 1.1.1: the same OTA LED bench firmware plus the wireless device link (src/wifi_link.cpp): a WebSocket over TLS to the backend carrying the device
; protocol, so the authenticated session (and HOST_LINK in the first-boot self-test), heartbeats, status and OTA coordination do not need USB.
[env:esp32s3_ota_led_v111]
extends = env:esp32s3
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1 -DBOARD_HAS_PSRAM -DTORQVA_TRANSPORT_SECURED=1 -DTORQVA_DEVICE_ID=\"RIG-1\" -DTORQVA_OTA_LED_BENCH=1 -DTORQVA_OLED=0 -DTORQVA_FW_VERSION=\"1.1.1\" -DTORQVA_BENCH_BLINK_MS=100 -DTORQVA_WIFI_LINK=1

; 1.1.2: 1.1.1 with the USB serial robustness fix (src/usb_out.cpp, lib/torqva_core/line_out.h): USB output never waits on the host, so the
; Wi-Fi link, telemetry and every task keep running when the cable is plugged in but no program reads COM10 (docs/TORQVA_OTA_LED_BENCH_TEST.md section 11).
[env:esp32s3_ota_led_v112]
extends = env:esp32s3
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1 -DBOARD_HAS_PSRAM -DTORQVA_TRANSPORT_SECURED=1 -DTORQVA_DEVICE_ID=\"RIG-1\" -DTORQVA_OTA_LED_BENCH=1 -DTORQVA_OLED=0 -DTORQVA_FW_VERSION=\"1.1.2\" -DTORQVA_BENCH_BLINK_MS=100 -DTORQVA_WIFI_LINK=1
