; TORQVA firmware. The legacy Arduino sketch (esp32/firmware/) is untouched.
; Host-side unit tests:   pio test -e native
; Device build (no flash): pio run -e esp32s3

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++11 -Wall -Wextra

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; N16R8: 16 MB flash, octal PSRAM -> GPIO 35-37 unavailable
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1 -DBOARD_HAS_PSRAM
